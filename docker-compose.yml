services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  
  pgadmin:
    image: dpage/pgadmin4:9.19
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets:
      - pgadmin_password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
  airflow:
    build: .
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8085:8085"        # NEW: dbt docs page
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      HN_PG_DSN: "host=postgres port=5432 dbname=hn user=airflow password=airflow"
      HN_DATA_DIR: /opt/airflow/data
      DBT_PG_HOST: postgres          # NEW
      DBT_PG_USER: airflow           # NEW
      DBT_PG_PASSWORD: airflow       # NEW
      DATABRICKS_TOKEN_FILE: /run/secrets/databricks_token
    secrets:
      - databricks_token
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt       # NEW: lets Airflow see the dbt folder
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs

volumes:
  pgdata:
  pgadmin_data:

secrets:
  databricks_token:
    file: ${USERPROFILE}/.hn-secrets/databricks_token.txt
  pgadmin_password:
    file: ${USERPROFILE}/.hn-secrets/pgadmin_password.txt